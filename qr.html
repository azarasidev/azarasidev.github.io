<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>あざらしツールズ | カスタムQRコードメーカー</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --accent-bg: rgba(56, 189, 248, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'M PLUS Rounded 1c', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background-color: var(--card);
      padding: 28px;
      border-radius: 24px;
      max-width: 850px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
    }

    .header-area {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      font-family: 'Kiwi Maru', serif;
      font-size: 24px;
      color: #f1f5f9;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    p.lead {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .grid {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
    }

    .controls {
      flex: 1;
      min-width: 290px;
    }

    /* モード切替タブ */
    .mode-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab.active {
      background: var(--accent);
      color: #0f172a;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }

    .group {
      margin-bottom: 18px;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row > * {
      flex: 1;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    /* わかりやすいヒント注釈 */
    .hint {
      display: block;
      font-size: 11px;
      color: var(--accent);
      margin-top: 4px;
      font-weight: normal;
    }

    input[type=text], textarea, select {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.25);
      color: inherit;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type=color] {
      width: 100%;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.25);
      cursor: pointer;
      padding: 4px;
    }

    input[type=file] {
      font-size: 12px;
      color: var(--muted);
      width: 100%;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    .logo-preview-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .logo-preview {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: contain;
      background: #fff;
      border: 1px solid var(--border);
      display: none;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    button {
      flex: 1;
      background: var(--accent);
      border: none;
      padding: 14px;
      border-radius: 12px;
      color: #0f172a;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    button.secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--muted);
    }

    button.small-btn {
      padding: 6px 12px;
      font-size: 12px;
      flex: none;
    }

    .preview {
      width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.25);
      border: 2px dashed var(--border);
    }

    #qrcodeCanvas {
      background: white;
      padding: 12px;
      border-radius: 12px;
      max-width: 100%;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .placeholder-text {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      line-height: 1.6;
    }

    .placeholder-icon {
      font-size: 40px;
      color: var(--border);
      margin-bottom: 8px;
    }

    @media (max-width: 680px) {
      .grid { flex-direction: column; }
      .preview { width: 100%; }
    }
  </style>
  <!-- QRコード生成ライブラリ (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
</head>
<body>

  <div class="card">
    <div class="header-area">
      <h1><i class="fa-solid fa-qrcode" style="color: var(--accent);"></i> 簡単デザインQRコードメーカー</h1>
      <p class="lead">Webサイトのアドレス（URL）やWi-Fi情報を入れるだけで、誰でも可愛いQRコードが作れます！</p>
    </div>

    <div class="grid">
      <div class="controls">
        <!-- モード切替タブ -->
        <div class="mode-tabs">
          <div class="tab active" data-mode="normal"><i class="fa-solid fa-link"></i> サイト・文字</div>
          <div class="tab" data-mode="wifi"><i class="fa-solid fa-wifi"></i> Wi-Fi接続用</div>
        </div>

        <!-- 通常モード -->
        <div id="mode-normal">
          <div class="group">
            <label for="text">作成したいWebサイトのURLやメッセージ</label>
            <textarea id="text" rows="3" placeholder="例: https://example.com"></textarea>
            <span class="hint">💡 「URL」とは「https://〜」から始まるページのWeb上の住所のことです。開きたいページのURLをそのままコピーして貼り付けてね！</span>
          </div>
        </div>

        <!-- Wi-Fiモード -->
        <div id="mode-wifi" style="display:none">
          <div class="group">
            <label for="wifi-ssid">Wi-Fiのお名前 (SSID)</label>
            <input id="wifi-ssid" type="text" placeholder="例: MyHome-WiFi">
            <span class="hint">💡 ルーターの裏面などに書いてあるネットワーク名を入力してね。</span>
          </div>
          <div class="group">
            <label for="wifi-pass">Wi-Fiのパスワード</label>
            <input id="wifi-pass" type="text" placeholder="例: password1234">
          </div>
        </div>

        <!-- カスタマイズ機能 -->
        <div class="group row">
          <div>
            <label for="fgColor">QRコードの色</label>
            <input type="color" id="fgColor" value="#0f172a">
          </div>
          <div>
            <label for="bgColor">背景の色</label>
            <input type="color" id="bgColor" value="#ffffff">
          </div>
        </div>

        <div class="group">
          <label for="dotStyle">ドットの形</label>
          <select id="dotStyle">
            <option value="square">四角（標準的で読み取りやすい）</option>
            <option value="dots">丸（やわらかいデザイン）</option>
          </select>
        </div>

        <!-- ロゴ設定 -->
        <div class="group">
          <label>真ん中に入れるアイコン画像（任意）</label>
          <input type="file" id="logoFile" accept="image/*">
          <div class="logo-preview-wrapper">
            <img id="logoPreview" class="logo-preview" alt="ロゴプレビュー">
            <button id="clearLogo" class="secondary small-btn" style="display:none"><i class="fa-solid fa-xmark"></i> 消去</button>
          </div>
        </div>

        <!-- アクションボタン -->
        <div class="btn-group">
          <button id="generate"><i class="fa-solid fa-wand-magic-sparkles"></i> QRコードを作る</button>
          <button id="download" class="secondary"><i class="fa-solid fa-download"></i> 画像を保存</button>
        </div>
      </div>

      <!-- プレビュー表示エリア -->
      <div class="preview">
        <canvas id="qrcodeCanvas" style="display:none"></canvas>
        <div id="placeholder" class="placeholder-text">
          <div class="placeholder-icon"><i class="fa-solid fa-qrcode"></i></div>
          文字やURLを入力して<br>「QRコードを作る」を押すと<br>ここに表示されます！
        </div>
      </div>
    </div>
  </div>

  <script>
    // エレメントの取得
    const elText = document.getElementById('text');
    const fgColor = document.getElementById('fgColor');
    const bgColor = document.getElementById('bgColor');
    const dotStyle = document.getElementById('dotStyle');
    const logoFile = document.getElementById('logoFile');
    const logoPreview = document.getElementById('logoPreview');
    const clearLogo = document.getElementById('clearLogo');
    
    const btnGen = document.getElementById('generate');
    const btnDownload = document.getElementById('download');
    const canvas = document.getElementById('qrcodeCanvas');
    const placeholder = document.getElementById('placeholder');

    const tabs = document.querySelectorAll('.tab');
    const modeNormal = document.getElementById('mode-normal');
    const modeWifi = document.getElementById('mode-wifi');

    const wifiSsid = document.getElementById('wifi-ssid');
    const wifiPass = document.getElementById('wifi-pass');

    let currentMode = 'normal';
    let userLogoData = null;

    // タブ切り替え処理
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentMode = tab.dataset.mode;

        if (currentMode === 'wifi') {
          modeNormal.style.display = 'none';
          modeWifi.style.display = 'block';
        } else {
          modeNormal.style.display = 'block';
          modeWifi.style.display = 'none';
        }
        generate();
      });
    });

    // ロゴファイルの読み込み処理
    logoFile.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (ev) => {
        userLogoData = ev.target.result;
        logoPreview.src = userLogoData;
        logoPreview.style.display = 'block';
        clearLogo.style.display = 'inline-block';
        generate();
      };
      reader.readAsDataURL(file);
    });

    // ロゴ消去ボタン
    clearLogo.addEventListener('click', () => {
      userLogoData = null;
      logoFile.value = '';
      logoPreview.src = '';
      logoPreview.style.display = 'none';
      clearLogo.style.display = 'none';
      generate();
    });

    // Wi-Fi文字列の生成
    function makeWifiString() {
      const ssid = wifiSsid.value.replace(/\\/g, '\\\\').replace(/;/g, '\\;');
      const pass = wifiPass.value.replace(/\\/g, '\\\\').replace(/;/g, '\\;');
      return `WIFI:T:WPA;S:${ssid};P:${pass};;`;
    }

    // 角丸四角を描画する描画関数
    function roundRect(ctx, x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // QRコード生成処理
    async function generate() {
      let content = '';

      if (currentMode === 'wifi') {
        if (!wifiSsid.value.trim()) {
          placeholder.style.display = 'block';
          canvas.style.display = 'none';
          return;
        }
        content = makeWifiString();
      } else {
        content = elText.value.trim();
        if (!content) {
          placeholder.style.display = 'block';
          canvas.style.display = 'none';
          return;
        }
      }

      try {
        const qr = QRCode.create(content, { errorCorrectionLevel: 'H' });
        const modules = qr.modules;
        const count = modules.size;
        const size = 320;
        const margin = 2;
        const cellSize = size / (count + margin * 2);

        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // 背景描画
        ctx.fillStyle = bgColor.value;
        ctx.fillRect(0, 0, size, size);

        // ドット描画
        ctx.fillStyle = fgColor.value;
        const isCircle = dotStyle.value === 'dots';

        for (let row = 0; row < count; row++) {
          for (let col = 0; col < count; col++) {
            if (modules.get(row, col)) {
              const x = (col + margin) * cellSize;
              const y = (row + margin) * cellSize;

              const isFinderPattern = 
                (row < 7 && col < 7) || 
                (row < 7 && col >= count - 7) || 
                (row >= count - 7 && col < 7);

              if (isCircle && !isFinderPattern) {
                ctx.beginPath();
                ctx.arc(x + cellSize / 2, y + cellSize / 2, cellSize / 2 * 0.85, 0, Math.PI * 2);
                ctx.fill();
              } else {
                ctx.fillRect(x, y, cellSize + 0.5, cellSize + 0.5);
              }
            }
          }
        }

        // ロゴ描画
        if (userLogoData) {
          const logo = new Image();
          logo.src = userLogoData;
          await new Promise((resolve) => {
            logo.onload = () => {
              const logoSize = size * 0.22;
              const lx = (size - logoSize) / 2;
              const ly = (size - logoSize) / 2;

              ctx.fillStyle = bgColor.value;
              roundRect(ctx, lx - 4, ly - 4, logoSize + 8, logoSize + 8, 6);
              ctx.fill();

              ctx.drawImage(logo, lx, ly, logoSize, logoSize);
              resolve();
            };
          });
        }

        placeholder.style.display = 'none';
        canvas.style.display = 'block';

      } catch (e) {
        console.error(e);
      }
    }

    // リアルタイム更新（文字や色を変えたら即座に反映）
    [elText, wifiSsid, wifiPass, fgColor, bgColor, dotStyle].forEach(el => {
      el.addEventListener('input', generate);
      el.addEventListener('change', generate);
    });

    btnGen.addEventListener('click', () => {
      if ((currentMode === 'normal' && !elText.value.trim()) || (currentMode === 'wifi' && !wifiSsid.value.trim())) {
        alert('まずはテキストやURLを入力してね！');
        return;
      }
      generate();
    });

    // 画像ダウンロード
    btnDownload.addEventListener('click', () => {
      if (canvas.style.display === 'none') {
        alert('まずはURLや文字を入力してQRコードを作成してね！');
        return;
      }
      const dataUrl = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = 'qrcode.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
    });

    // 初期入力例
    elText.value = 'https://example.com';
    generate();
  </script>
</body>
</html>
