<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>カスタムQRコードメーカー</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #06b6d4;
      --accent-hover: #0891b2;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background-color: var(--card);
      padding: 24px;
      border-radius: 16px;
      max-width: 850px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 20px;
      margin-bottom: 6px;
    }

    p.lead {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 20px;
    }

    .grid {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .controls {
      flex: 1;
      min-width: 300px;
    }

    .mode-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: rgba(0, 0, 0, 0.2);
      padding: 4px;
      border-radius: 10px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 8px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--accent);
      color: #000;
      font-weight: bold;
    }

    .group {
      margin-bottom: 16px;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row > * {
      flex: 1;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type=text], textarea, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.2);
      color: inherit;
      font-size: 14px;
      outline: none;
    }

    input[type=color] {
      width: 100%;
      height: 40px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.2);
      cursor: pointer;
      padding: 4px;
    }

    input[type=file] {
      font-size: 13px;
      color: var(--muted);
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }

    .logo-preview-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .logo-preview {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      object-fit: contain;
      background: #fff;
      border: 1px solid var(--border);
      display: none;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      background: var(--accent);
      border: none;
      padding: 12px;
      border-radius: 10px;
      color: #000;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    button.secondary:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    button.small-btn {
      padding: 6px 10px;
      font-size: 12px;
      flex: none;
    }

    .preview {
      width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 20px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px dashed var(--border);
    }

    #qrcodeCanvas {
      background: white;
      padding: 12px;
      border-radius: 8px;
      max-width: 100%;
    }

    .placeholder-text {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 680px) {
      .grid { flex-direction: column; }
      .preview { width: 100%; }
    }
  </style>
  <!-- QRコード生成ライブラリ (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
</head>
<body>

  <div class="card">
    <h1>かんたんデザインQRコードメーカー</h1>
    <p class="lead">色や形、中央ロゴをお好みでカスタマイズしてQRコードを作成できます。</p>

    <div class="grid">
      <div class="controls">
        <!-- モード切替タブ -->
        <div class="mode-tabs">
          <div class="tab active" data-mode="normal">URL・文字</div>
          <div class="tab" data-mode="wifi">Wi‑Fi用</div>
        </div>

        <!-- 通常モード -->
        <div id="mode-normal">
          <div class="group">
            <label for="text">作成したいURLやメッセージ</label>
            <textarea id="text" rows="3" placeholder="例: https://example.com や こんにちは！"></textarea>
          </div>
        </div>

        <!-- Wi-Fiモード -->
        <div id="mode-wifi" style="display:none">
          <div class="group">
            <label for="wifi-ssid">ネットワーク名 (SSID)</label>
            <input id="wifi-ssid" type="text" placeholder="例: MyHome-WiFi">
          </div>
          <div class="group">
            <label for="wifi-pass">パスワード</label>
            <input id="wifi-pass" type="text" placeholder="例: password1234">
          </div>
        </div>

        <!-- カスタマイズ機能 -->
        <div class="group row">
          <div>
            <label for="fgColor">QRコードの色</label>
            <input type="color" id="fgColor" value="#000000">
          </div>
          <div>
            <label for="bgColor">背景の色</label>
            <input type="color" id="bgColor" value="#ffffff">
          </div>
        </div>

        <div class="group">
          <label for="dotStyle">ドットの形状</label>
          <select id="dotStyle">
            <option value="square">四角（標準）</option>
            <option value="dots">丸（ドット）</option>
          </select>
        </div>

        <!-- ロゴ設定 -->
        <div class="group">
          <label>中央ロゴ画像</label>
          <input type="file" id="logoFile" accept="image/*">
          <div class="logo-preview-wrapper">
            <img id="logoPreview" class="logo-preview" alt="ロゴプレビュー">
            <button id="clearLogo" class="secondary small-btn" style="display:none">ロゴを消す</button>
          </div>
        </div>

        <!-- アクションボタン -->
        <div class="btn-group">
          <button id="generate">QRコードを作る</button>
          <button id="download" class="secondary">画像として保存</button>
        </div>
      </div>

      <!-- プレビュー表示エリア -->
      <div class="preview">
        <canvas id="qrcodeCanvas" style="display:none"></canvas>
        <div id="placeholder" class="placeholder-text">ここにQRコードが<br>表示されます</div>
      </div>
    </div>
  </div>

  <script>
    // エレメントの取得
    const elText = document.getElementById('text');
    const fgColor = document.getElementById('fgColor');
    const bgColor = document.getElementById('bgColor');
    const dotStyle = document.getElementById('dotStyle');
    const logoFile = document.getElementById('logoFile');
    const logoPreview = document.getElementById('logoPreview');
    const clearLogo = document.getElementById('clearLogo');
    
    const btnGen = document.getElementById('generate');
    const btnDownload = document.getElementById('download');
    const canvas = document.getElementById('qrcodeCanvas');
    const placeholder = document.getElementById('placeholder');

    const tabs = document.querySelectorAll('.tab');
    const modeNormal = document.getElementById('mode-normal');
    const modeWifi = document.getElementById('mode-wifi');

    const wifiSsid = document.getElementById('wifi-ssid');
    const wifiPass = document.getElementById('wifi-pass');

    let currentMode = 'normal';
    let userLogoData = null;

    // タブ切り替え処理
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentMode = tab.dataset.mode;

        if (currentMode === 'wifi') {
          modeNormal.style.display = 'none';
          modeWifi.style.display = 'block';
        } else {
          modeNormal.style.display = 'block';
          modeWifi.style.display = 'none';
        }
      });
    });

    // ロゴファイルの読み込み処理
    logoFile.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (ev) => {
        userLogoData = ev.target.result;
        logoPreview.src = userLogoData;
        logoPreview.style.display = 'block';
        clearLogo.style.display = 'inline-block';
      };
      reader.readAsDataURL(file);
    });

    // ロゴ消去ボタン
    clearLogo.addEventListener('click', () => {
      userLogoData = null;
      logoFile.value = '';
      logoPreview.src = '';
      logoPreview.style.display = 'none';
      clearLogo.style.display = 'none';
    });

    // Wi-Fi文字列の生成
    function makeWifiString() {
      const ssid = wifiSsid.value.replace(/\\/g, '\\\\').replace(/;/g, '\\;');
      const pass = wifiPass.value.replace(/\\/g, '\\\\').replace(/;/g, '\\;');
      return `WIFI:T:WPA;S:${ssid};P:${pass};;`;
    }

    // 角丸四角を描画する描画関数
    function roundRect(ctx, x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // QRコード生成処理
    async function generate() {
      let content = '';

      if (currentMode === 'wifi') {
        if (!wifiSsid.value.trim()) {
          alert('ネットワーク名（SSID）を入力してください');
          return;
        }
        content = makeWifiString();
      } else {
        content = elText.value.trim();
        if (!content) {
          alert('URLまたはメッセージを入力してください');
          return;
        }
      }

      try {
        // ロゴを重ねるため、誤り訂正レベルを「H（最高: 30%）」に設定
        const qr = QRCode.create(content, { errorCorrectionLevel: 'H' });
        const modules = qr.modules;
        const count = modules.size;
        const size = 320;
        const margin = 2;
        const cellSize = size / (count + margin * 2);

        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // 背景描画
        ctx.fillStyle = bgColor.value;
        ctx.fillRect(0, 0, size, size);

        // ドットの描画処理
        ctx.fillStyle = fgColor.value;
        const isCircle = dotStyle.value === 'dots';

        for (let row = 0; row < count; row++) {
          for (let col = 0; col < count; col++) {
            if (modules.get(row, col)) {
              const x = (col + margin) * cellSize;
              const y = (row + margin) * cellSize;

              // 四角い検出パターン（位置合わせマーク）の周りは丸めずそのまま描画
              const isFinderPattern = 
                (row < 7 && col < 7) || 
                (row < 7 && col >= count - 7) || 
                (row >= count - 7 && col < 7);

              if (isCircle && !isFinderPattern) {
                ctx.beginPath();
                ctx.arc(x + cellSize / 2, y + cellSize / 2, cellSize / 2 * 0.85, 0, Math.PI * 2);
                ctx.fill();
              } else {
                ctx.fillRect(x, y, cellSize + 0.5, cellSize + 0.5);
              }
            }
          }
        }

        // ロゴを重ねる処理
        if (userLogoData) {
          const logo = new Image();
          logo.src = userLogoData;
          await new Promise((resolve) => {
            logo.onload = () => {
              const logoSize = size * 0.22; // 中央22%の大きさ
              const lx = (size - logoSize) / 2;
              const ly = (size - logoSize) / 2;

              // ロゴの背景に白（指定背景色）の枠を描いて視認性を確保
              ctx.fillStyle = bgColor.value;
              roundRect(ctx, lx - 4, ly - 4, logoSize + 8, logoSize + 8, 6);
              ctx.fill();

              // ロゴ画像を描画
              ctx.drawImage(logo, lx, ly, logoSize, logoSize);
              resolve();
            };
          });
        }

        // プレビュー表示切り替え
        placeholder.style.display = 'none';
        canvas.style.display = 'block';

      } catch (e) {
        console.error(e);
        alert('QRコードの生成に失敗しました');
      }
    }

    // イベントリスナーの登録
    btnGen.addEventListener('click', generate);

    // 画像のダウンロード処理
    btnDownload.addEventListener('click', () => {
      if (canvas.style.display === 'none') {
        alert('先に「QRコードを作る」ボタンを押してください');
        return;
      }
      const dataUrl = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = 'qrcode.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
    });

    // 初期サンプルテキスト
    elText.value = 'https://example.com';
  </script>
</body>
</html>
